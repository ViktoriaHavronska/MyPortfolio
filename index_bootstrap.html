<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">MyPortfolio</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="bg-light text-center p-5">
    <div class="container">
        <h1>Hello, I'm a Frontend Developer</h1>
        <p class="lead">Discover Frontend world using HTML, CSS, BOOTSTRAP etc. </p>

        <button class="btn btn-primary">View Projects</button>
    </div>
</section>

<!-- CARDS -->
<section class="container my-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Project 1</h5>
                    <p class="card-text">Simple website project</p>
                    <button class="btn btn-outline-primary">View</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Project 2</h5>
                    <p class="card-text">Bootstrap practice</p>
                    <button class="btn btn-outline-primary">View</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Project 3</h5>
                    <p class="card-text">Frontend project</p>
                    <button class="btn btn-outline-primary">View</button>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- CONTACT FORM -->
<section class="container my-5">
    <h2 class="text-center mb-4">Contact Me</h2>

    <form>
        <div class="mb-3">
            <input type="text" class="form-control" placeholder="Your Name">
        </div>

        <div class="mb-3">
            <input type="email" class="form-control" placeholder="Your Email">
        </div>

        <div class="mb-3">
            <textarea class="form-control" rows="4" placeholder="Message"></textarea>
        </div>

        <button class="btn btn-outline-primary">Send</button>
    </form>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3">
    <p>&copy; 2026 My Portfolio</p>
</footer>
</body>
</html>
